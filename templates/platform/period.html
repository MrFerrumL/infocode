<form class="filters period-filter"><label>С<input type="date" name="from" value="{{ start|date:'Y-m-d' }}"></label><label>По<input type="date" name="to" value="{{ end|date:'Y-m-d' }}"></label>{% if groups %}<label>Группа<select name="group"><option value="">Все мои ученики</option>{% for g in groups %}<option value="{{ g.pk }}" {% if group == g.pk|stringformat:'s' %}selected{% endif %}>{{ g.title }}</option>{% endfor %}</select></label>{% endif %}<button class="button secondary">Применить</button></form>
