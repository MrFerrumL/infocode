<div class="pagination">{% if page.has_previous %}<a href="?q={{ query|urlencode }}&amp;difficulty={{ difficulty|default:''|urlencode }}&amp;status={{ status|default:''|urlencode }}&amp;page={{ page.previous_page_number }}">← Назад</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?q={{ query|urlencode }}&amp;difficulty={{ difficulty|default:''|urlencode }}&amp;status={{ status|default:''|urlencode }}&amp;page={{ page.next_page_number }}">Дальше →</a>{% endif %}</div>
