services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infocode
      POSTGRES_USER: infocode
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infocode"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-postgres.txt
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_NAME: infocode
      DB_USER: infocode
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      LOG_DIR: /data/logs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/uploads
      - logs:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  media:
  logs:
