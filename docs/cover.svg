<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Инфокод — учебная платформа</title>
  <desc id="desc">Подготовка к ЕГЭ по информатике и физике. Python, Django, PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f1ff"/><stop offset="1" stop-color="#fbfcff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7562ee"/><stop offset="1" stop-color="#5140cc"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="298" rx="24" fill="url(#background)" stroke="#e4def7"/>
  <circle cx="1140" cy="20" r="190" fill="#eee9ff"/>
  <circle cx="1270" cy="310" r="170" fill="#edf6d7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="51" width="64" height="64" rx="18" fill="url(#accent)"/>
    <text x="66" y="97" font-size="43" font-weight="700" fill="#fff">и</text><circle cx="102" cy="69" r="5" fill="#d6f885"/>
    <text x="137" y="96" font-size="45" font-weight="700" letter-spacing="-1.8" fill="#242332">инфокод<tspan fill="#6550db">.</tspan></text>
    <text x="52" y="165" font-size="29" font-weight="700" fill="#242332">От учебной темы — к уверенной практике.</text>
    <text x="52" y="207" font-size="18" fill="#625d79">Каталог задач · Курсы · Контрольные · Работа преподавателя</text>
    <text x="52" y="254" font-size="14" font-weight="700" letter-spacing="1.3" fill="#6550db">PYTHON / DJANGO / POSTGRESQL / DOCKER</text>
    <rect x="905" y="81" width="130" height="140" rx="18" fill="#fff" stroke="#e2ddf3"/>
    <text x="928" y="143" font-size="43" font-weight="700" fill="#6550db">27</text>
    <text x="928" y="177" font-size="13" fill="#696479">информатика</text>
    <rect x="1051" y="81" width="130" height="140" rx="18" fill="#fff" stroke="#e2ddf3"/>
    <text x="1075" y="143" font-size="43" font-weight="700" fill="#6550db">26</text>
    <text x="1075" y="177" font-size="13" fill="#696479">физика</text>
  </g>
</svg>
